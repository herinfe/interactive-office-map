<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huddle 259</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ui-bg: rgba(17,17,17,0.85);
      --ui-bg-panel: rgba(17,17,17,0.55);
      --ui-border: rgba(255,255,255,0.12);
      --ui-text: #ffffff;
      --ui-text-dim: #aaaaaa;
      --ui-divider: rgba(255,255,255,0.1);
      --accent: #32CD32;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: "Lato", sans-serif;
      background: #f0f0f0;
      color: var(--ui-text);
    }

    /* ── Back button ── */
    .back-button {
      position: fixed;
      top: clamp(10px, 1.2vw, 18px);
      left: clamp(10px, 1.2vw, 18px);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: clamp(6px, 0.8vw, 10px) clamp(10px, 1.2vw, 16px);
      background: var(--ui-bg);
      color: var(--ui-text);
      text-decoration: none;
      border: 1px solid var(--ui-border);
      border-radius: clamp(4px, 0.6vw, 10px);
      font-family: "Lato", sans-serif;
      font-size: clamp(11px, 1.2vw, 15px);
      letter-spacing: 0.02em;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .back-button:hover {
      border-color: rgba(255,255,255,0.3);
      background: rgba(40,40,40,0.92);
    }

    /* ── Page layout ── */
    .page {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 100vh;
      height: 100vh;
    }

    /* ── Left panel — photo ── */
    .photo-panel {
      position: relative;
      overflow: hidden;
    }

    .photo-panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.85) 0%,
        rgba(0,0,0,0.2) 45%,
        transparent 70%
      );
      pointer-events: none;
    }

    .room-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
      padding: clamp(20px, 3vw, 40px);
    }

    .room-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(10px, 1vw, 13px);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px clamp(10px, 1.2vw, 14px);
      border-radius: 999px;
      margin-bottom: clamp(6px, 0.8vw, 12px);
      border: 1px solid;
      transition: all 0.4s ease;
    }

    .room-status-badge.available {
      color: #32CD32;
      background: rgba(50, 205, 50, 0.15);
      border-color: rgba(50, 205, 50, 0.35);
    }

    .room-status-badge.booked {
      color: #ff4444;
      background: rgba(255, 68, 68, 0.15);
      border-color: rgba(255, 68, 68, 0.35);
    }

    .room-status-badge.loading {
      color: #aaaaaa;
      background: rgba(170,170,170,0.1);
      border-color: rgba(170,170,170,0.2);
    }

    .status-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .available .status-badge-dot { box-shadow: 0 0 6px #32CD32; }
    .booked .status-badge-dot { box-shadow: 0 0 6px #ff4444; }

    .room-tag {
      display: block;
      font-size: clamp(10px, 1vw, 13px);
      font-weight: 400;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.55);
      margin-bottom: clamp(8px, 1vw, 14px);
      margin-top: 2px;
    }

    .room-name {
      font-size: clamp(24px, 3.5vw, 52px);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
      margin: 0 0 clamp(8px, 1vw, 16px);
    }

    .room-meta {
      display: flex;
      gap: clamp(8px, 1vw, 14px);
      flex-wrap: wrap;
      margin-bottom: clamp(12px, 1.5vw, 20px);
    }

    /* darker chips for legibility */
    .meta-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: clamp(10px, 1vw, 13px);
      color: #ffffff;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      padding: 5px clamp(10px, 1.2vw, 14px);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }

    /* ── Booking form ── */
    .booking-form {
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: clamp(8px, 1vw, 14px);
      padding: clamp(12px, 1.5vw, 20px);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(6px, 0.8vw, 10px);
    }

    .booking-form .form-full { grid-column: 1 / -1; }

    .booking-form label {
      display: block;
      font-size: clamp(9px, 0.85vw, 11px);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-bottom: 4px;
    }

    .booking-form input {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: white;
      font-family: "Lato", sans-serif;
      font-size: clamp(11px, 1vw, 13px);
      padding: clamp(5px, 0.6vw, 8px) clamp(8px, 0.8vw, 10px);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .booking-form input:focus { border-color: rgba(255,255,255,0.4); }

    .booking-form input[type="date"]::-webkit-calendar-picker-indicator,
    .booking-form input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      opacity: 0.5;
    }

    .booking-form button[type="submit"] {
      grid-column: 1 / -1;
      background: #FFD700;
      color: #111;
      border: none;
      border-radius: 6px;
      font-family: "Lato", sans-serif;
      font-size: clamp(11px, 1vw, 13px);
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: clamp(7px, 0.8vw, 10px);
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .booking-form button[type="submit"]:hover { opacity: 0.88; }
    .booking-form button[type="submit"]:active { transform: scale(0.98); }

    /* ── Confirmation overlay ── */
    #confirmOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }

    #confirmOverlay.visible { display: flex; }

    .confirm-box {
      background: #1e1e1e;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      padding: clamp(24px, 3vw, 40px);
      max-width: 380px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    .confirm-box h3 {
      margin: 0 0 6px;
      font-size: clamp(16px, 1.8vw, 22px);
      font-weight: 700;
    }

    .confirm-box .confirm-sub {
      font-size: clamp(11px, 1.1vw, 13px);
      color: var(--ui-text-dim);
      margin-bottom: 20px;
    }

    .confirm-detail {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .confirm-row {
      display: flex;
      justify-content: space-between;
      font-size: clamp(11px, 1.1vw, 13px);
    }

    .confirm-row span:first-child {
      color: var(--ui-text-dim);
      text-transform: uppercase;
      font-size: clamp(9px, 0.85vw, 11px);
      letter-spacing: 0.06em;
      font-weight: 700;
    }

    .confirm-actions {
      display: flex;
      gap: 10px;
    }

    .confirm-actions button {
      flex: 1;
      padding: clamp(8px, 1vw, 12px);
      border-radius: 8px;
      font-family: "Lato", sans-serif;
      font-size: clamp(11px, 1vw, 13px);
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s ease;
      border: none;
    }

    #confirmCancel {
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1px solid rgba(255,255,255,0.15) !important;
    }

    #confirmCancel:hover { opacity: 0.75; }

    #confirmSubmit {
      background: #32CD32;
      color: #111;
    }

    #confirmSubmit:hover { opacity: 0.88; }

    /* ── Inline feedback message ── */
    #bookingFeedback {
      display: none;
      grid-column: 1 / -1;
      padding: clamp(8px, 1vw, 12px) clamp(10px, 1.2vw, 14px);
      border-radius: 6px;
      font-size: clamp(11px, 1vw, 13px);
      font-weight: 700;
      text-align: center;
    }

    #bookingFeedback.visible { display: block; }
    #bookingFeedback.success { background: rgba(50,205,50,0.15); color: #32CD32; border: 1px solid rgba(50,205,50,0.3); }
    #bookingFeedback.error { background: rgba(255,68,68,0.15); color: #ff6666; border: 1px solid rgba(255,68,68,0.3); }

    /* ── Right panel — calendar ── */
    .calendar-panel {
      display: flex;
      flex-direction: column;
      background: #1a1a1a;
      border-left: 1px solid var(--ui-border);
      overflow: hidden;
    }

    .calendar-header {
      padding: clamp(16px, 2vw, 28px) clamp(16px, 2vw, 28px) clamp(12px, 1.5vw, 20px);
      border-bottom: 1px solid var(--ui-divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .calendar-title {
      font-size: clamp(11px, 1.1vw, 14px);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ui-text-dim);
    }

    .calendar-scroll {
      flex: 1;
      overflow: auto;
    }

    .calendar-panel iframe {
      width: 100%;
      min-width: 600px;
      height: 100%;
      min-height: 500px;
      border: none;
      display: block;
      filter: invert(1) hue-rotate(180deg);
    }

    @media (max-width: 700px) {
      .page {
        grid-template-columns: 1fr;
        grid-template-rows: 45vh 1fr;
        height: auto;
        min-height: 100vh;
      }
      .calendar-panel {
        border-left: none;
        border-top: 1px solid var(--ui-border);
        min-height: 500px;
      }
    }
  </style>
</head>
<body>

  <a class="back-button" href="javascript:history.back()">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Back to Map
  </a>

  <!-- Confirmation overlay -->
  <div id="confirmOverlay">
    <div class="confirm-box">
      <h3>Confirm Booking</h3>
      <p class="confirm-sub">Please review the details before confirming.</p>
      <div class="confirm-detail">
        <div class="confirm-row"><span>Room</span><span id="confirmRoom">—</span></div>
        <div class="confirm-row"><span>Subject</span><span id="confirmSubject">—</span></div>
        <div class="confirm-row"><span>Date</span><span id="confirmDate">—</span></div>
        <div class="confirm-row"><span>Time</span><span id="confirmTime">—</span></div>
      </div>
      <div class="confirm-actions">
        <button id="confirmCancel">Cancel</button>
        <button id="confirmSubmit">Confirm Booking</button>
      </div>
    </div>
  </div>

  <div class="page">

    <!-- Left: room photo + info -->
    <div class="photo-panel">
      <img src="Huddle%20259.jpg" alt="Huddle 259">
      <div class="room-info">

        <h1 class="room-name">Huddle 259</h1>
        <div class="room-tag">West Broad · 2nd Floor</div>

        <div class="room-meta">
          <div class="meta-chip">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="4" r="2.2" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 10.5c0-2.485 2.015-4.5 4.5-4.5s4.5 2.015 4.5 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            4 people
          </div>
          <div class="meta-chip">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1.5" y="2.5" width="9" height="7" rx="1" stroke="currentColor" stroke-width="1.3"/><path d="M4 1.5v2M8 1.5v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Bookable
          </div>
          <div class="meta-chip">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1.5" y="1.5" width="9" height="7" rx="1" stroke="currentColor" stroke-width="1.3"/><path d="M4 10.5h4M6 8.5v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Display screen
          </div>
        </div>

        <form class="booking-form" id="bookingForm">
          <div class="form-full">
            <label for="meetingSubject">Meeting Subject</label>
            <input type="text" id="meetingSubject" placeholder="e.g. Team standup" required>
          </div>
          <div class="form-full">
            <label for="meetingDate">Date</label>
            <input type="date" id="meetingDate" required>
          </div>
          <div>
            <label for="startTime">Start Time</label>
            <input type="time" id="startTime" required>
          </div>
          <div>
            <label for="endTime">End Time</label>
            <input type="time" id="endTime" required>
          </div>
          <div id="bookingFeedback" class="form-full"></div>
          <button type="submit">Book Room</button>
        </form>

      </div>
    </div>

    <!-- Right: calendar -->
    <div class="calendar-panel">
      <div class="calendar-header">
        <div class="calendar-title">Room Calendar</div>
        <div class="room-status-badge loading" id="roomStatusBadge">
          <div class="status-badge-dot"></div>
          <span id="roomStatusText">Checking status…</span>
        </div>
      </div>
      <div class="calendar-scroll">
        <iframe
          src="https://outlook.office365.com/owa/calendar/43bfc87f94e042e7bfc5b72c54d6bee4@eab.com/fd054f7806714526b96f1235d57c482710605677343016712128/calendar.html"
          scrolling="yes">
        </iframe>
      </div>
    </div>

  </div>

  <script>
    const apiBase = window.location.protocol === "file:" ? "http://localhost:3000" : "";

    // ── Live status badge ──
    async function checkRoomStatus() {
      const badge = document.getElementById("roomStatusBadge");
      const text = document.getElementById("roomStatusText");
      try {
        const res = await fetch(`${apiBase}/checkCalendar`);
        const data = await res.json();
        const booked = !!data["ric_259@eab.com"];
        badge.className = "room-status-badge " + (booked ? "booked" : "available");
        text.textContent = booked ? "Currently Booked" : "Available Now";
      } catch {
        badge.className = "room-status-badge loading";
        text.textContent = "Status unavailable";
      }
    }

    checkRoomStatus();

    // ── Booking form — show confirmation ──
    let pendingFormData = null;

    document.getElementById("bookingForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const subject = document.getElementById("meetingSubject").value;
      const date = document.getElementById("meetingDate").value;
      const start = document.getElementById("startTime").value;
      const end = document.getElementById("endTime").value;

      // Populate confirm box
      document.getElementById("confirmSubject").textContent = subject;
      document.getElementById("confirmDate").textContent = new Date(date + "T12:00:00").toLocaleDateString([], { weekday: "short", month: "short", day: "numeric", year: "numeric" });
      document.getElementById("confirmTime").textContent = formatTime(start) + " – " + formatTime(end);

      pendingFormData = {
        userEmail: "ric_259@eab.com",
        subject,
        start: date + "T" + start + ":00",
        end: date + "T" + end + ":00",
        attendees: []
      };

      document.getElementById("confirmOverlay").classList.add("visible");
    });

    document.getElementById("confirmCancel").addEventListener("click", function () {
      document.getElementById("confirmOverlay").classList.remove("visible");
      pendingFormData = null;
    });

    document.getElementById("confirmSubmit").addEventListener("click", function () {
      document.getElementById("confirmOverlay").classList.remove("visible");
      submitBooking(pendingFormData);
      pendingFormData = null;
    });

    function submitBooking(data) {
      const feedback = document.getElementById("bookingFeedback");
      const submitBtn = document.querySelector("#bookingForm button[type='submit']");

      submitBtn.textContent = "Booking…";
      submitBtn.style.opacity = "0.6";
      submitBtn.style.pointerEvents = "none";

      fetch(`${apiBase}/createEvent`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      })
      .then(res => {
        if (!res.ok) throw new Error();
        return res.json();
      })
      .then(() => {
        feedback.textContent = "✓ Room booked successfully!";
        feedback.className = "form-full visible success";
        document.getElementById("bookingForm").reset();
        checkRoomStatus();
      })
      .catch(() => {
        feedback.textContent = "✕ Booking failed. Please try again.";
        feedback.className = "form-full visible error";
      })
      .finally(() => {
        submitBtn.textContent = "Book Room";
        submitBtn.style.opacity = "";
        submitBtn.style.pointerEvents = "";
        setTimeout(() => { feedback.className = "form-full"; }, 5000);
      });
    }

    function formatTime(t) {
      const [h, m] = t.split(":").map(Number);
      const ampm = h >= 12 ? "PM" : "AM";
      return ((h % 12) || 12) + ":" + String(m).padStart(2, "0") + " " + ampm;
    }
  </script>

</body>
</html>
