<!DOCTYPE html>
<html>
<head>

<body>

  <a class="back-button" href="javascript:history.back()">

  <div class="page">
    <div class="photo-panel" style="grid-column: 1 / -1;">
      <img src="Copy%20238.jpg" alt="Copy Station 238">

        <h1 class="room-name">Copy Station 238</h1>
        <div class="room-tag">West Broad · 2nd Floor</div>

          <div class="meta-chip">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1.5" y="2" width="9" height="7" rx="1" stroke="currentColor" stroke-width="1.3"/><path d="M4 2V1M8 2V1M3 9v2h6V9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Printer
          </div>
          <div class="meta-chip">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="2" y="1.5" width="8" height="9" rx="1" stroke="currentColor" stroke-width="1.3"/><path d="M4 4h4M4 6h4M4 8h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Laminator
          </div>
          <div class="meta-chip">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 2h6l-1 8H4L3 2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M2 2h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Shredder
          </div>
          <div class="meta-chip">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1.5" y="3" width="9" height="7" rx="1" stroke="currentColor" stroke-width="1.3"/><path d="M4 3V2a2 2 0 014 0v1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Supplies
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
