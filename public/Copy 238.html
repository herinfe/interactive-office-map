<!DOCTYPE html>
<html>

<head>
    <title>Copy 238</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: auto;
            position: relative; /* Make the body a positioning context for absolute positioning */
        }

        .back-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .back-button:hover {
            background-color: #0056b3;
        }

        img {
            max-width: 100%; /* Adjust the width as needed */
            height: auto;
            display: block; /* Add this to center the image */
            margin-bottom: 20px; /* Add some space between the image and the video */
        }

        /* Style the container for the calendar */
        .calendar-container {
            position: absolute;
            bottom: -610px; /* Adjust the bottom position as needed */
            left: 20px; /* Adjust the left position as needed */
            width: 1150px; /* Adjust the initial width as needed */
            height: 600px; /* Adjust the initial height as needed */
            border: 1px solid #ccc; /* Add a border around the calendar box */
            resize: both; /* Enable resizing */
            overflow: hidden; /* Allow content to be scrolled if needed */
        }

        /* Style the iframe inside the calendar container */
        #outlook-calendar {
            width: 100%; /* Adjust the width as needed */
            height: 100%; /* Adjust the height as needed */
            border: none; /* Remove iframe border */
        }

        /* Add styles for the video container */
        .video-container {
            max-width: 100%; /* Adjust width as needed */
        }

        video {
            width: 100%; /* make video take full width of its container */
            height: auto;
        }

    </style>
</head>

<body>
    <a class="back-button" href="javascript:history.back()">Back</a>
    <img src="Copy 238.jpg">

    <!-- Video Container -->
    <div class="video-container">
        <video controls> <!-- 'controls' attribute to add play, pause, and volume controls -->
            <source src="Follow Me Printing.mp4" type="video/mp4"> <!-- path to the video file -->
            Your browser does not support the video tag.
        </video>
    </div>
</body>

</html>
