  <style>
    /* ── Default = light mode ── */
    :root {
      --ui-bg: rgba(17,17,17,0.85);
      --ui-bg-panel: rgba(17,17,17,0.55);
      --ui-border: rgba(255,255,255,0.15);
      --ui-border-hover: rgba(255,255,255,0.3);
      --ui-text: #ffffff;
      --ui-text-dim: #cccccc;
      --ui-text-links: #eeeeee;
      --ui-hover-bg: rgba(255,255,255,0.08);
      --ui-btn-bg: rgba(255,255,255,0.1);
      --ui-btn-hover: rgba(255,255,255,0.25);
      --ui-divider: rgba(255,255,255,0.1);
      --ui-close-color: #888;
    }

    body {
      font-family: "Lato", Roboto, "Segoe UI", Arial, sans-serif;
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      transition: background 0.4s ease;
    }

    html { height: 100%; }

    .sidepanel {
      width: 0;
      position: fixed;
      z-index: 5;
      height: 100%;
      top: 0;
      left: 0;
      background: var(--ui-bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-right: 1px solid var(--ui-divider);
      overflow-x: hidden;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      padding-top: 0;
      box-shadow: 4px 0 24px rgba(0,0,0,0.4);
    }

    .sidepanel-inner {
      width: clamp(180px, 22vw, 280px);
      padding-top: clamp(50px, 6vw, 80px);
      padding-bottom: clamp(16px, 2vw, 32px);
    }

    .sidepanel a {
      padding: clamp(6px, 0.8vw, 12px) clamp(16px, 2vw, 32px);
      text-decoration: none;
      font-size: clamp(13px, 1.5vw, 20px);
      color: var(--ui-text-links);
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: clamp(6px, 0.8vw, 12px);
      transition: color 0.2s ease, background 0.2s ease;
      border-radius: 0 clamp(4px, 0.5vw, 8px) clamp(4px, 0.5vw, 8px) 0;
      margin-right: clamp(8px, 1vw, 16px);
      white-space: nowrap;
    }

    .sidepanel a:hover {
      color: var(--ui-text);
      background: var(--ui-hover-bg);
    }

    .sidepanel .closebtn {
      position: absolute;
      top: clamp(8px, 1vw, 16px);
      right: clamp(12px, 1.5vw, 20px);
      font-size: clamp(20px, 2.5vw, 32px);
      color: var(--ui-close-color);
      transition: color 0.2s ease;
      line-height: 1;
    }

    .sidepanel .closebtn:hover {
      color: #fff;
      background: none;
    }

    .sidepanel-divider {
      height: 1px;
      background: var(--ui-divider);
      margin: clamp(6px, 0.8vw, 12px) clamp(16px, 2vw, 32px);
    }

    .openbtn {
      position: fixed;
      z-index: 3;
      top: 1vw;
      left: 1vw;
      font-size: clamp(11px, 1.4vw, 20px);
      cursor: pointer;
      background: var(--ui-bg);
      color: var(--ui-text);
      padding: clamp(5px, 0.7vw, 10px) clamp(7px, 1vw, 15px);
      border: 1px solid var(--ui-border);
      border-radius: clamp(4px, 0.6vw, 10px);
      display: flex;
      align-items: center;
      gap: clamp(4px, 0.5vw, 8px);
      letter-spacing: 0.02em;
      transition: background 0.2s ease, border-color 0.2s ease;
      font-family: "Lato", sans-serif;
    }

    .openbtn:hover {
      border-color: var(--ui-border-hover);
    }

    #mapWrap {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    #officeMap {
      width: 100%;
      height: 100%;
      display: block;
    }

    .clickableRect {
      fill: #000000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .clickableRect:hover { opacity: 0.5; }
    .blueSection .clickableRect:hover { fill: #0000ff; opacity: 0.5; }
    .orangeSection .clickableRect:hover { fill: #FFA500; opacity: 0.5; }
    .tealSection .clickableRect:hover { fill: #008080; opacity: 0.5; }
    .yellowSection .clickableRect:hover { fill: #FFFF00; opacity: 0.5; }
    .greySection .clickableRect:hover { fill: #525252; opacity: 0.5; }

    #tooltip {
      position: fixed;
      background: var(--ui-bg);
      color: var(--ui-text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-family: "Lato", sans-serif;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 10;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    #tooltip.visible { opacity: 1; }

    #tooltip-status { font-size: 12px; margin-top: 3px; }
    .status-available { color: #32CD32; }
    .status-booked { color: #ff4444; }
    .status-unknown { color: #aaaaaa; }

    #loadingIndicator {
      position: fixed;
      z-index: 6;
      top: 1vw;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ui-bg);
      color: var(--ui-text);
      font-size: clamp(9px, 1.1vw, 14px);
      padding: clamp(4px, 0.6vw, 8px) clamp(8px, 1vw, 14px);
      border-radius: clamp(4px, 0.6vw, 8px);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    #loadingIndicator.visible { opacity: 1; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner {
      width: clamp(8px, 1vw, 13px);
      height: clamp(8px, 1vw, 13px);
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    #legend {
      position: fixed;
      z-index: 4;
      left: 1vw;
      bottom: 1vw;
      background: var(--ui-bg);
      padding: clamp(4px, 0.6vw, 10px) clamp(6px, 0.9vw, 14px);
      border-radius: clamp(4px, 0.6vw, 10px);
      color: var(--ui-text);
      font-size: clamp(9px, 1.1vw, 14px);
      display: flex;
      flex-direction: column;
      gap: clamp(3px, 0.4vw, 6px);
    }

    #legend .legend-item {
      display: flex;
      align-items: center;
      gap: clamp(4px, 0.5vw, 8px);
    }

    #legend .dot {
      width: clamp(6px, 0.7vw, 11px);
      height: clamp(6px, 0.7vw, 11px);
      border-radius: 50%;
      flex-shrink: 0;
    }

    #legend .dot-available { background-color: #32CD32; }
    #legend .dot-booked { background-color: #ff4444; }

    #errorState {
      display: none;
      font-size: clamp(8px, 0.9vw, 11px);
      color: #ffaa44;
      align-items: center;
      gap: clamp(3px, 0.4vw, 5px);
    }

    #errorState.visible {
      display: flex;
    }

    #lastUpdated {
      font-size: clamp(8px, 0.9vw, 11px);
      color: var(--ui-text-dim);
      margin-top: clamp(2px, 0.3vw, 4px);
      border-top: 1px solid var(--ui-divider);
      padding-top: clamp(2px, 0.3vw, 4px);
    }

    #zoomUi {
      position: fixed;
      z-index: 4;
      right: 1vw;
      bottom: 1vw;
      background: var(--ui-bg);
      padding: clamp(4px, 0.6vw, 10px);
      border-radius: clamp(4px, 0.6vw, 10px);
      color: var(--ui-text);
      display: flex;
      align-items: center;
      gap: clamp(4px, 0.6vw, 8px);
      font-size: clamp(9px, 1.1vw, 14px);
    }

    #zoomUi button {
      width: clamp(22px, 2.2vw, 30px);
      height: clamp(22px, 2.2vw, 30px);
      font-size: clamp(14px, 1.4vw, 20px);
      line-height: 1;
      cursor: pointer;
      background: var(--ui-btn-bg);
      color: var(--ui-text);
      border: 1px solid var(--ui-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
      flex-shrink: 0;
      padding: 0;
    }

    #zoomUi button:hover { background: var(--ui-btn-hover); }

    #zoomResetBtn {
      border-radius: clamp(3px, 0.4vw, 6px) !important;
      font-size: clamp(9px, 1vw, 13px) !important;
      width: auto !important;
      padding: 0 clamp(5px, 0.6vw, 8px) !important;

    }

    #zoomLabel {

    }

    #zoomSlider {
      width: clamp(60px, 8vw, 120px);
      accent-color: rgba(255,255,255,0.6);
    }
  </style>

  <script>
    const tooltip = document.getElementById("tooltip");
    const tooltipName = document.getElementById("tooltip-name");
    const tooltipStatus = document.getElementById("tooltip-status");

    document.querySelectorAll("a[data-room]").forEach(anchor => {
      const roomName = anchor.getAttribute("data-room");
      const resultId = anchor.getAttribute("data-result");

      let hoverTimer;
      anchor.addEventListener("mousemove", (e) => {
        clearTimeout(hoverTimer);
        tooltip.style.left = (e.clientX + 14) + "px";
        tooltip.style.top = (e.clientY - 10) + "px";
        tooltipName.textContent = roomName;

        if (anchor.getAttribute("data-permanent")) {
          tooltipStatus.className = "status-unknown";
          tooltipStatus.textContent = "● Permanent Office";
        } else if (resultId) {
          const el = document.getElementById(resultId);
          if (el && el.style.stroke) {
            const booked = el.style.stroke === "red";
            tooltipStatus.className = booked ? "status-booked" : "status-available";
            tooltipStatus.textContent = booked ? "● Booked" : "● Available";
          } else {
            tooltipStatus.className = "status-unknown";
            tooltipStatus.textContent = "● Status unknown";
          }
        } else {
          tooltipStatus.textContent = "";
        }

        hoverTimer = setTimeout(() => { tooltip.classList.add("visible"); }, 400);
      });

      anchor.addEventListener("mouseleave", () => {
        clearTimeout(hoverTimer);
        tooltip.classList.remove("visible");
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>

  <script>
    window.addEventListener("load", function () {
      if (!window.svgPanZoom) return;

      const panZoom = window.svgPanZoom("#officeMap", {
        zoomEnabled: true,
        panEnabled: true,
        panFactor: 50,
        limits: true,
        controlIconsEnabled: false,
        fit: true,
        center: true,
        zoomScaleSensitivity: 0.25,
        minZoom: 0.6,
        maxZoom: 4,
        mouseWheelZoomEnabled: true,
        zoomAtPoint: true,
        dblClickZoomEnabled: false,
        preventMouseEventsDefault: true
      });

      const zoomInBtn = document.getElementById("zoomInBtn");
      const zoomOutBtn = document.getElementById("zoomOutBtn");
      const zoomSlider = document.getElementById("zoomSlider");
      const zoomLabel = document.getElementById("zoomLabel");
      const zoomResetBtn = document.getElementById("zoomResetBtn");
      let isDraggingSlider = false;

      const minZoom = panZoom.getMinZoom ? panZoom.getMinZoom() : 0.6;
      const maxZoom = panZoom.getMaxZoom ? panZoom.getMaxZoom() : 4;

      zoomResetBtn.addEventListener("click", function () {
        panZoom.reset(); panZoom.fit(); panZoom.center(); updateZoomUi();
      });

      function zoomToSliderValue(v) {
        const t = Number(v) / 100;
        panZoom.zoom(minZoom + (maxZoom - minZoom) * t);
      }

      function sliderValueFromZoom(z) {
        return Math.max(0, Math.min(100, Math.round((z - minZoom) / (maxZoom - minZoom) * 100)));
      }

      function updateZoomUi() {
        const z = panZoom.getZoom();
        zoomLabel.textContent = Math.round(z * 100) + "%";
        if (!isDraggingSlider) zoomSlider.value = sliderValueFromZoom(z);
      }

      zoomInBtn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); panZoom.zoomIn(); updateZoomUi(); });
      zoomOutBtn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); panZoom.zoomOut(); updateZoomUi(); });

      zoomSlider.addEventListener("pointerdown", (e) => { isDraggingSlider = true; e.stopPropagation(); });
      window.addEventListener("pointerup", () => { isDraggingSlider = false; updateZoomUi(); });
      zoomSlider.addEventListener("input", (e) => { e.stopPropagation(); zoomToSliderValue(zoomSlider.value); updateZoomUi(); });
      zoomSlider.addEventListener("change", (e) => { e.stopPropagation(); zoomToSliderValue(zoomSlider.value); updateZoomUi(); });

      panZoom.setOnZoom(() => updateZoomUi());

      let resizeTimer = null;
      window.addEventListener("resize", function () {
        panZoom.resize(); panZoom.fit(); panZoom.center(); panZoom.updateBBox();
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          const z = panZoom.getZoom();
          const minZ = panZoom.getMinZoom ? panZoom.getMinZoom() : minZoom;
          if (Math.abs(z - minZ) < 0.02) { panZoom.fit(); panZoom.center(); }
          panZoom.updateBBox(); updateZoomUi();
        }, 80);
      });

      window.addEventListener("keydown", function (e) {
        const tag = document.activeElement.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA") return;
        switch (e.key) {
          case "+": case "=": e.preventDefault(); panZoom.zoomIn(); updateZoomUi(); break;
          case "-": e.preventDefault(); panZoom.zoomOut(); updateZoomUi(); break;
          case "0": e.preventDefault(); panZoom.fit(); panZoom.center(); updateZoomUi(); break;
          case "ArrowUp": panZoom.panBy({ x: 0, y: 50 }); break;
          case "ArrowDown": panZoom.panBy({ x: 0, y: -50 }); break;
          case "ArrowLeft": panZoom.panBy({ x: 50, y: 0 }); break;
          case "ArrowRight": panZoom.panBy({ x: -50, y: 0 }); break;
        }
      });

      updateZoomUi();
    });
  </script>
