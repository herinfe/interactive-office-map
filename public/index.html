  <style>
    body {
      font-family: "Lato", Roboto, "Segoe UI", Arial, sans-serif;
    }

    .sidepanel  {
      width: 0;
      position: fixed;
      z-index: 2;
      height: auto;
      top: 0;
      left: 0;
      background-color: #111;
      overflow-x: hidden;
      transition: 0.5s;
      padding-top: 60px;
    }

    .sidepanel a {
      padding: 8px 8px 8px 32px;
      text-decoration: none;
      font-size: 25px;
      color: #818181;
      display: block;
      transition: 0.3s;
    }

    .sidepanel a:hover {
      color: #f1f1f1;
    }

    .sidepanel .closebtn {
      position: absolute;
      top: 0;
      right: 25px;
      font-size: 36px;
    }

    .openbtn {
      position: fixed;
      z-index: 3;
      top: 10px;
      left: 10px;

      font-size: 20px;
      cursor: pointer;
      background-color: #111;
      color: white;
      padding: 10px 15px;
      border: none;
    }

    .openbtn:hover {
      background-color: #444;
    }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

#mapWrap {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
}

#officeMap {
  width: 100%;
  height: 100%;
  display: block;
}

    .clickableRect {
      fill: #000000;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .clickableRect:hover {
      opacity: 0.5;
    }

    /* Section hover colors */
    .blueSection .clickableRect:hover {
      fill: #0000ff;
      opacity: 0.5;
    }

    .orangeSection .clickableRect:hover {
      fill: #FFA500;
      opacity: 0.5;
    }

    .tealSection .clickableRect:hover {
      fill: #008080;
      opacity: 0.5;
    }

    .yellowSection .clickableRect:hover {
      fill: #FFFF00;
      opacity: 0.5;
    }

.greySection .clickableRect:hover {
  fill: #525252;
  opacity: 0.5;
}

#zoomUi {
  position: fixed;
  z-index: 4;
  right: 10px;
  bottom: 10px;
  left: auto;
  top: auto;
  background: rgba(17, 17, 17, 0.85);
  padding: 8px;
  border-radius: 8px;
  color: white;
  display: flex;
  align-items: center;
  gap: 8px;
}
</style>

  <script>
    async function fetchOfficeInfo() {
      try {
        const apiBase = window.location.protocol === "file:" ? "http://localhost:3000" : "";
        const response = await fetch(`${apiBase}/checkCalendar`);
        const data = await response.json();

        const setRect = (id, key) => {
          const el = document.getElementById(id);
          if (!el) return;
          el.style.stroke = data[key] ? "red" : "#32CD32";
          el.style.strokeWidth = "5";
          el.style.fill = "none";
        };

        setRect("result202", "ric_202@eab.com");
        setRect("result203", "ric_203@eab.com");
        setRect("result204", "ric_204@eab.com");
        setRect("result205", "ric_205@eab.com");

        setRect("result213", "ric_213@eab.com");

        setRect("result220", "ric_220@eab.com");
        setRect("result221", "ric_221@eab.com");

<script>
  window.addEventListener("load", function () {
    if (!window.svgPanZoom) return;

    const panZoom = window.svgPanZoom("#officeMap", {
      zoomEnabled: true,
      panEnabled: true,
      panFactor: 50,
      limits: true,
      controlIconsEnabled: false,
      fit: true,
      center: true,
      zoomScaleSensitivity: 0.25,
      minZoom: 0.6,
      maxZoom: 4,
      mouseWheelZoomEnabled: true,
      zoomAtPoint: true,
      dblClickZoomEnabled: false,
      preventMouseEventsDefault: true
    });

const zoomInBtn = document.getElementById("zoomInBtn");
const zoomOutBtn = document.getElementById("zoomOutBtn");
const zoomSlider = document.getElementById("zoomSlider");
const zoomLabel = document.getElementById("zoomLabel");
const zoomResetBtn = document.getElementById("zoomResetBtn");
let isDraggingSlider = false;

    const minZoom = panZoom.getMinZoom ? panZoom.getMinZoom() : 0.6;
    const maxZoom = panZoom.getMaxZoom ? panZoom.getMaxZoom() : 4;

zoomResetBtn.addEventListener("click", function () {
  panZoom.reset();
  panZoom.fit();
  panZoom.center();
  updateZoomUi();
});

    function zoomToSliderValue(v) {
      const t = Number(v) / 100;
      const z = minZoom + (maxZoom - minZoom) * t;
      panZoom.zoom(z);
    }

    function sliderValueFromZoom(z) {
      const t = (z - minZoom) / (maxZoom - minZoom);
      return Math.max(0, Math.min(100, Math.round(t * 100)));
    }

    function updateZoomUi() {
      const z = panZoom.getZoom();
      zoomLabel.textContent = Math.round(z * 100) + "%";
      if (!isDraggingSlider) {
        zoomSlider.value = sliderValueFromZoom(z);
      }
    }

    zoomInBtn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      panZoom.zoomIn();
      updateZoomUi();
    });

    zoomOutBtn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      panZoom.zoomOut();
      updateZoomUi();
    });

    zoomSlider.addEventListener("pointerdown", function (e) {
      isDraggingSlider = true;
      e.stopPropagation();
    });

    window.addEventListener("pointerup", function () {
      isDraggingSlider = false;
      updateZoomUi();
    });

    zoomSlider.addEventListener("input", function (e) {
      e.stopPropagation();
      zoomToSliderValue(zoomSlider.value);
      updateZoomUi();
    });

    zoomSlider.addEventListener("change", function (e) {
      e.stopPropagation();
      zoomToSliderValue(zoomSlider.value);
      updateZoomUi();
    });

    panZoom.setOnZoom(function () {
      updateZoomUi();
    });

    let resizeTimer = null;
   window.addEventListener("resize", function () {
  panZoom.resize();
  panZoom.fit();
  panZoom.center();
  panZoom.updateBBox();

  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    const z = panZoom.getZoom();
    const minZ = panZoom.getMinZoom ? panZoom.getMinZoom() : minZoom;
    const nearMin = Math.abs(z - minZ) < 0.02;

    if (nearMin) {
      panZoom.fit();
      panZoom.center();
    }

    panZoom.updateBBox();
    updateZoomUi();
  }, 80);
});

    // Keyboard shortcuts
    window.addEventListener("keydown", function (e) {
      const tag = document.activeElement.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;

      switch (e.key) {
        case "+":
        case "=":
          e.preventDefault();
          panZoom.zoomIn();
          updateZoomUi();
          break;

        case "-":
          e.preventDefault();
          panZoom.zoomOut();
          updateZoomUi();
          break;

        case "0":
          e.preventDefault();
          panZoom.fit();
          panZoom.center();
          updateZoomUi();
          break;

        case "ArrowUp":
          panZoom.panBy({ x: 0, y: 50 });
          break;

        case "ArrowDown":
          panZoom.panBy({ x: 0, y: -50 });
          break;

        case "ArrowLeft":
          panZoom.panBy({ x: 50, y: 0 });
          break;

        case "ArrowRight":
          panZoom.panBy({ x: -50, y: 0 });
          break;
      }
    });

    updateZoomUi();
  });
</script>
