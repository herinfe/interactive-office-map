<script>
  function openNav() {
    document.getElementById("Sidepanel").style.width = "250px";
  }

  function closeNav() {
    document.getElementById("Sidepanel").style.width = "0";
  }
  
 async function fetchOfficeInfo() {
    try {
        const response = await fetch('http://localhost:3000/checkCalendar');
        const data = await response.json();

        const resultElement = document.getElementById('result');

        if (data.isBusy) {
            resultElement.style.backgroundColor = 'red';
			resultElement.style.opacity = '0.5';
        } else {
            resultElement.style.backgroundColor = 'green';
			resultElement.style.opacity = '0.5';
        }

        // Setting the box's appearance
        resultElement.style.width = '125px';
        resultElement.style.height = '75px';
        resultElement.style.borderRadius = '5px';
        resultElement.style.position = 'absolute';

        // Position the box at x and y coordinates (adjust these values as needed)
        const x = '1430px';
        const y = '680px';
        resultElement.style.left = x;
        resultElement.style.top = y;

    } catch (error) {
        console.error('Failed to check calendar status:', error);
        const resultElement = document.getElementById('result');
        resultElement.style.backgroundColor = '';  // Resetting background color in case of error
    }
}

 // Call the function on load, or you can also call it on a button click or other event
        fetchOfficeInfo();
</script>
